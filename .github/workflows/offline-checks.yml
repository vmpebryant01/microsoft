# Author: Paul Bryant
name: Offline report checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  reports:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Import Python dependencies
        run: python -c "import azure.identity, requests, requests_kerberos"
      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module -Name Az.Accounts,Az.ResourceGraph -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          Import-Module Az.Accounts,Az.ResourceGraph -ErrorAction Stop
      - name: Check generated report files
        shell: pwsh
        run: |
          python tools/build_reports.py
          git diff --exit-code
      - name: Compile Python reports
        run: python -m compileall -q .
      - name: Test Python reports
        run: python -m unittest discover -s tests -v
      - name: Test PowerShell reports
        shell: pwsh
        run: ./tests/Test-Reports.ps1
